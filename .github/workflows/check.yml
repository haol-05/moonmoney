name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version --all
      - name: Update the registry index
        run: moon update
      - name: Check
        run: moon check --deny-warn --target all
      - name: Build
        run: moon build --target all
      - name: Test
        run: moon test --deny-warn --target all
      - name: Run the demo
        run: moon run examples/demo
      - name: Package
        # Builds the zip the registry would receive, without publishing it.
        run: moon package
      - name: Run the command line
        run: moon run cmd/main -- tax 10000 USD 19%
      - name: Check formatting
        # Compares the hand-written sources only. `moon fmt` and `moon info` also
        # rewrite the generated `.mbti` interfaces, and those spell the default
        # integer type `Int` on Windows and `Int32` on Linux: comparing them would
        # fail on a spelling that says nothing about the code. Both spellings are
        # produced by the toolchain itself, so neither is more correct.
        run: |
          moon fmt
          moon info
          git diff --exit-code -- '*.mbt'
