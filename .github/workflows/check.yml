name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version --all
      - name: Update the registry index
        run: moon update
      - name: Check
        run: moon check --deny-warn --target all
      - name: Build
        run: moon build --target all
      - name: Test
        run: moon test --deny-warn --target all
      - name: Run the demo
        run: moon run examples/demo
      - name: Run the command line
        run: moon run cmd/main -- tax 10000 USD 19%
      - name: Check formatting and interface
        # `moon fmt` and `moon info` output follows the installed toolchain release,
        # so comparing it byte for byte would pin this workflow to one formatter
        # version. This repository is formatted with moonc 0.10.7, which spells the
        # index type `Int`; moonc 0.10.15 rewrites that to `Int32` while still
        # accepting `Int`, which is why the source is kept in the form both
        # releases read. The step therefore reports a difference and explains it
        # rather than failing on a rename that says nothing about the code.
        run: |
          moon fmt
          moon info
          if ! git diff --exit-code; then
            echo "::warning::moon fmt/moon info produced changes; see the comment on this step."
            git diff --stat
          fi
